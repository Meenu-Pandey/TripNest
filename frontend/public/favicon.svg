  </g>
  
  <!-- Destination Pin -->
  <g transform="translate(85, 25) scale(2) translate(-12, -24)">
    <path d="M 12 24 C 7 18, 5 15, 5 11 C 5 7.13, 8.13 4, 12 4 C 15.87 4, 19 7.13, 19 11 C 19 15, 17 18, 12 24 Z" fill="#D55E38" />
